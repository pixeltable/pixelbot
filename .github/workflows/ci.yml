name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --group dev
        working-directory: backend
      - run: uv run python -c "import pixelbot, pixeltable; assert pixelbot.__version__ == '3.0.0'; assert pixeltable.__version__ == '0.7.7'"
        working-directory: backend
      - run: uv run pytest -q
        working-directory: backend
      - if: matrix.python-version == '3.11'
        run: |
          uv run ruff check pixelbot tests
          uv run ruff format --check pixelbot tests
          uv run mypy pixelbot
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.11"
      - run: uv sync --locked --group dev
        working-directory: backend
      - name: Verify fresh dependency resolution
        working-directory: backend
        run: |
          uv pip compile pyproject.toml --python-version 3.11 --output-file "$RUNNER_TEMP/fresh-requirements.txt"
          grep -Fx "pixeltable==0.7.7" "$RUNNER_TEMP/fresh-requirements.txt"
      - run: uv build
        working-directory: backend
      - name: Verify source distribution contents
        working-directory: backend
        run: |
          uv run python - <<'PY'
          import tarfile
          from pathlib import Path, PurePosixPath

          archive = next(Path("dist").glob("pixelbot-*.tar.gz"))
          with tarfile.open(archive) as package:
              files = [PurePosixPath(member.name) for member in package.getmembers() if member.isfile()]
          forbidden = {"uv-bin", "uv-cache", "dist", "static", ".venv"}
          leaked = [path for path in files if len(path.parts) > 1 and path.parts[1] in forbidden]
          assert not leaked, leaked[:10]
          assert len(files) < 200, f"Unexpectedly large sdist: {len(files)} files"
          PY
      - run: |
          uv venv wheel-test
          uv pip install --python wheel-test/bin/python dist/pixelbot-3.0.0-py3-none-any.whl --no-deps
          wheel-test/bin/python -c "import importlib.resources as r, pixelbot; assert (r.files('pixelbot') / 'static' / 'index.html').is_file()"
        working-directory: backend

  pixeltable-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.11"
      - run: uv sync --locked --group dev
        working-directory: backend
      - run: |
          export PIXELTABLE_HOME="$RUNNER_TEMP/pixelbot-catalog"
          uv run pxt schema check pixelbot/app.py
          set +e
          uv run pxt schema update pixelbot/app.py pixelbot_v3 --dry-run --json
          result=$?
          set -e
          test "$result" -eq 2
          uv run pxt schema update pixelbot/app.py pixelbot_v3 -f
          uv run pxt schema diff pixelbot/app.py pixelbot_v3 --json
          trap 'uv run pxt service stop pixelbot_v3/app || true' EXIT
          uv run pxt service update pixelbot/app.py pixelbot_v3 app --port 8000 -f
          curl --fail --retry 10 --retry-delay 1 http://127.0.0.1:8000/api/health
          uv run pxt service list --json
          test -f "$PIXELTABLE_HOME/logs/services/pixelbot_v3/app.log"
          tail -20 "$PIXELTABLE_HOME/logs/services/pixelbot_v3/app.log"
          uv run pxt service stop pixelbot_v3/app
          trap - EXIT
        working-directory: backend
