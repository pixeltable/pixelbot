[project]
name = "pixelbot"
version = "2.0.0"
description = "Multimodal AI Agent powered by Pixeltable"
requires-python = ">=3.10"
dependencies = [
    # Web Framework
    "fastapi",
    "uvicorn[standard]",
    "python-dotenv",
    "python-multipart",
    # AI and ML
    "pixeltable>=0.6.5",
    "google-genai",
    "anthropic",
    "openai",
    "mistralai",
    "sentence-transformers",
    "timm",
    "tiktoken",
    "spacy",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "numpy",
    "umap-learn",
    "Pillow",
    "openpyxl",
    # Tools & Data
    "duckduckgo-search",
    "yfinance",
]
