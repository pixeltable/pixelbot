[project]
name = "pixelbot"
version = "3.0.0"
description = "Multimodal AI Agent powered by Pixeltable"
requires-python = ">=3.11"
dependencies = [
    # Web Framework
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    # AI and ML
    "pixeltable[serve]>=0.7.7,<0.8",
    "google-genai",
    "anthropic",
    "openai",
    "mistralai",
    "torch",
    "transformers",
    "spacy",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "numpy",
    "umap-learn",
    "Pillow",
    "openpyxl",
    "pandas",
    "pyarrow",
    "requests",
    # Tools & Data
    "duckduckgo-search",
    "yfinance",
]

[dependency-groups]
dev = [
    "build>=1.3",
    "mypy>=1.18",
    "pytest>=8.4",
    "ruff>=0.13",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pixelbot"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"pixelbot/schema.py" = ["F821"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy", "pixeltable.mypy"]
check_untyped_defs = true
ignore_missing_imports = true
# TableModel attributes are bound by Pixeltable at runtime. The 0.7.7 mypy
# plugin currently exposes those attributes as ``Table | None``.
disable_error_code = ["union-attr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: exercises the real Pixeltable CLI and local service"]
